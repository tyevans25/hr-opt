services:
  postgres:
    image: postgres:16
    container_name: hr-opt-postgres
    environment:
      POSTGRES_USER: hropt
      POSTGRES_PASSWORD: hropt123
      POSTGRES_DB: hropt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: hr-opt-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
